{% extends "base.html" %}
{% block content %}

<!-- 🔐 Login Popup -->
<div id="login-modal" class="modal">
  <div class="modal-content">
    <h2 class="modal-title">Welcome Back 👋</h2>
    <p class="modal-subtitle">Please sign in to continue</p>

    <div class="form-group">
      <input type="text" id="login-username" placeholder="Username" />
    </div>
    <div class="form-group">
      <input type="password" id="login-password" placeholder="Password" />
    </div>

    <button id="login-btn" class="btnlogin">Login</button>
    <p id="login-error" class="error-text">Invalid credentials</p>
  </div>
</div>

<!-- 🔒 Dashboard (hidden until login) -->
<div id="dashboard" style="display:none;">
    <section class="card">
        <h2>Launch a new run</h2>
        <form id="launch-form" hx-post="/launch" hx-target="#toast-slot" hx-swap="outerHTML">
            <input type="hidden" name="queries" id="queries-json" value=""/>
            <div class="grid">
                <label>Source
                    <select name="source">
                        <option value="gmaps">gmaps</option>
                    </select>
                </label>
                <div id="queries-container" style="grid-column: 1 / -1;">
                    <div id="query-items">
                        <div class="query-item" data-index="0">
                            <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end;">
                                <label>Search / Industry
                                    <input type="text" class="query-input" name="q" placeholder="e.g. digital marketing" required/>
                                </label>
                                <label>Location
                                    <input type="text" class="location-input" name="location" placeholder="e.g. New York, NY" required/>
                                </label>
                                <button type="button" class="remove-query-btn" style="display: none; padding: 8px 12px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; height: fit-content;">Remove</button>
                            </div>
                        </div>
                    </div>
                    <button type="button" id="add-query-btn" style="margin-top: 10px; padding: 8px 16px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer;">+ Add </button>
                </div>
                <!-- <label>Use Proxy
                    <select name="use_proxy">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </label> -->
                <!-- <label>Proxy mode
                    <select name="proxy_mode">
                        <option value="rotating">Rotating</option>
                        <option value="sticky" selected>Sticky</option>
                    </select>
                </label> -->
                <!-- <label>Variants
                    <input type="number" name="concurrency" value="2" min="1" max="64"/>
                </label> -->
                <!-- <label>IP per worker
                    <select name="ip_per_worker">
                        <option value="0" selected>No</option>
                        <option value="1" >Yes</option>
                    </select>
                </label>
                <label>Delay min
                    <input type="number" step="0.01" name="delay_min" value="0.05"/>
                </label>
                <label>Delay max
                    <input type="number" step="0.01" name="delay_max" value="0.15"/>
                </label>
                <label>Max retries
                    <input type="number" name="max_retries" value="3" min="0" max="10"/>
                </label>
                <label>Retry backoff
                    <input type="number" step="0.1" name="retry_backoff" value="1.6"/>
                </label>
                <label>Use Hunter Cache
                    <select name="use_hunter_cache">
                        <option value="1" selected>Yes</option>
                        <option value="0">No (fresh verify)</option>
                    </select>
                </label> -->
                <!-- <label>Verify concurrency
                    <input type="number" name="verify_concurrency" value="2" min="1" max="64"/>
                </label> -->
                <!-- <label>Max pages per site
                    <input type="number" name="max_pages" value="30" min="1" max="200"/>
                </label>
                <label>Run ID (optional)
                    <input type="text" name="run_id" placeholder="e.g. my_custom_runid"/>
                </label> -->
            </div>
            <div>
                <button class="btnlogin">Launch</button>
            </div>
        </form>
        <div id="toast-slot"></div>
    </section>

    <section class="tabs">
        <div class="tablist">
            <button class="tab active" data-tab="#running">Running</button>
            <button class="tab" data-tab="#history">History</button>
            <button class="tab" data-tab="#records">Records</button>
        </div>

        <div id="running" class="tabpanel active"
             hx-get="/fragment/running" hx-trigger="load, every 5s" hx-target="#running" hx-swap="innerHTML">
             <!-- running table loads here -->
            </div>

        <div id="history" class="tabpanel"
             hx-get="/fragment/runs" hx-trigger="load, every 10s" hx-target="#history" hx-swap="innerHTML">
            <!-- runs history table loads here -->
            </div>

        <div id="records" class="tabpanel"
             hx-get="/fragment/records" hx-trigger="load, every 10s" hx-target="#records" hx-swap="innerHTML">
            <!-- records table loads here -->
            </div>
    </section>
</div>


<style>
/* Modal background */
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex; justify-content: center; align-items: center;
  z-index: 1000;
  font-family: "Segoe UI", Roboto, sans-serif;
}

/* Modal card */
.modal-content {
  background: #ffffff;
  padding: 30px 25px;
  border-radius: 16px;
  width: 340px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  text-align: center;
  animation: fadeInUp 0.3s ease;
}

/* Title + subtitle */
.modal-title {
  margin: 0 0 10px;
  font-size: 1.6rem;
  font-weight: 600;
  color: #2d3748;
}
.modal-subtitle {
  margin: 0 0 20px;
  font-size: 0.9rem;
  color: #718096;
}

/* Input fields */
.form-group {
  margin-bottom: 15px;
}
.modal-content input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 0.95rem;
  outline: none;
  transition: all 0.2s;
}
.modal-content input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
}

/* Button */
.btnlogin {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: #3b82f6;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}
.btnlogin:hover {
  background: #2563eb;
}

/* Error message */
.error-text {
  display: none;
  margin-top: 12px;
  font-size: 0.85rem;
  color: #e11d48;
}

/* Animation */
@keyframes fadeInUp {
  from {
    transform: translateY(20px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}
</style>

<script>
    const USERNAME = "nr-medical.com";
    const PASSWORD = "TurkeyMake8!";

document.addEventListener("DOMContentLoaded", () => {
    const modal = document.getElementById("login-modal");
    const dashboard = document.getElementById("dashboard");
    const error = document.getElementById("login-error");

    // Check if already logged in
    if (sessionStorage.getItem("isLogin") === "true") {
        modal.style.display = "none";
        dashboard.style.display = "block";
    }

    document.getElementById("login-btn").addEventListener("click", () => {
        const u = document.getElementById("login-username").value.trim();
        const p = document.getElementById("login-password").value.trim();

        if (u === USERNAME && p === PASSWORD) {
            sessionStorage.setItem("isLogin", "true");
            modal.style.display = "none";
            dashboard.style.display = "block";
        } else {
            error.style.display = "block";
        }
    });
});
    // 1) Auto-dismiss the Launch toast after HTMX finishes the /launch request
    document.body.addEventListener('htmx:afterRequest', (evt) => {
        const el = evt.detail && evt.detail.elt;
        if (!el) return;
        // Only when the launch form was the source of the request
        if (el.id === 'launch-form') {
            setTimeout(() => {
                const slot = document.getElementById('toast-slot');
                if (slot) slot.innerHTML = '';
            }, 4000);
        }
    });

    (function () {
        const TAB_KEY = "dash.activeTab";
        const DEFAULT_TAB = "#running";

        function activateTab(targetSel) {
            const wrapper = document.querySelector('.tabs');
            if (!wrapper) return;
            wrapper.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const btn = wrapper.querySelector(`.tab[data-tab="${targetSel}"]`);
            if (btn) btn.classList.add('active');
            wrapper.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
            const panel = wrapper.querySelector(targetSel);
            if (panel) panel.classList.add('active');
        }

        document.addEventListener('click', (e) => {
            const b = e.target.closest('.tab');
            if (!b) return;
            const targetSel = b.getAttribute('data-tab');
            if (!targetSel) return;
            activateTab(targetSel);
            try {
                localStorage.setItem(TAB_KEY, targetSel);
            } catch (_) {
            }
            if (targetSel.startsWith('#')) history.replaceState(null, "", targetSel);
        });

        document.addEventListener('DOMContentLoaded', () => {
            let targetSel = DEFAULT_TAB;
            if (location.hash && document.querySelector(`.tab[data-tab="${location.hash}"]`)) {
                targetSel = location.hash;
            }
            try {
                const saved = localStorage.getItem(TAB_KEY);
                if (saved && document.querySelector(`.tab[data-tab="${saved}"]`)) targetSel = saved;
            } catch (_) {
            }
            activateTab(targetSel);
            if (targetSel.startsWith('#') && location.hash !== targetSel) {
                history.replaceState(null, "", targetSel);
            }
        });
    })();

    // Remove run functionality
    function removeRun(runId) {
        if (!confirm(`Are you sure you want to stop and delete run "${runId}"? This action cannot be undone.`)) {
            return;
        }
        
        const button = event.target;
        const originalText = button.textContent;
        button.textContent = 'Removing...';
        button.disabled = true;
        
        fetch(`/remove/${runId}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
            },
        })
        .then(response => {
            if (response.ok) {
                return response.json();
            }
            throw new Error('Network response was not ok');
        })
        .then(data => {
            // Show success message
            showToast('success', data.message);
            
            // Refresh the running table to reflect the removal
            setTimeout(() => {
                const runningPanel = document.getElementById('running');
                if (runningPanel && typeof htmx !== 'undefined') {
                    htmx.trigger(runningPanel, 'htmx:trigger');
                }
            }, 1000);
        })
        .catch(error => {
            console.error('Error removing run:', error);
            showToast('error', `Failed to remove run: ${error.message}`);
            button.textContent = originalText;
            button.disabled = false;
        });
    }
    
    function showToast(type, message) {
        const toastSlot = document.getElementById('toast-slot');
        if (!toastSlot) return;
        
        const toastClass = type === 'success' ? 'toast success' : 'toast error';
        toastSlot.innerHTML = `
            <div class="${toastClass}">
                ${message}
            </div>
        `;
        
        // Auto-dismiss after 4 seconds
        setTimeout(() => {
            toastSlot.innerHTML = '';
        }, 4000);
    }

    // Dynamic query management
    document.addEventListener('DOMContentLoaded', () => {
        const queriesContainer = document.getElementById('queries-container');
        const addBtn = document.getElementById('add-query-btn');
        const queryItems = document.getElementById('query-items');
        const maxQueries = 5;

        function updateRemoveButtons() {
            const items = queryItems.querySelectorAll('.query-item');
            items.forEach((item, index) => {
                const removeBtn = item.querySelector('.remove-query-btn');
                if (items.length > 1) {
                    removeBtn.style.display = 'block';
                } else {
                    removeBtn.style.display = 'none';
                }
            });
            if (items.length >= maxQueries) {
                addBtn.style.display = 'none';
            } else {
                addBtn.style.display = 'block';
            }
        }

        function addQueryItem() {
            if (queryItems.children.length >= maxQueries) return;
            
            const index = queryItems.children.length;
            const newItem = document.createElement('div');
            newItem.className = 'query-item';
            newItem.setAttribute('data-index', index);
            newItem.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 10px;">
                    <label>Search / Industry
                        <input type="text" class="query-input" placeholder="e.g. digital marketing" required/>
                    </label>
                    <label>Location
                        <input type="text" class="location-input" placeholder="e.g. New York, NY" required/>
                    </label>
                    <button type="button" class="remove-query-btn" style="padding: 8px 12px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; height: fit-content;">Remove</button>
                </div>
            `;
            queryItems.appendChild(newItem);
            updateRemoveButtons();
            
            // Attach remove handler
            newItem.querySelector('.remove-query-btn').addEventListener('click', () => {
                newItem.remove();
                updateRemoveButtons();
            });
        }

        function removeQueryItem(item) {
            item.remove();
            updateRemoveButtons();
        }

        // Add button handler
        addBtn.addEventListener('click', addQueryItem);

        // Remove button handlers (for existing items)
        queryItems.addEventListener('click', (e) => {
            if (e.target.classList.contains('remove-query-btn')) {
                const item = e.target.closest('.query-item');
                removeQueryItem(item);
            }
        });

        updateRemoveButtons();

        // Intercept form submission to update queries JSON
        const form = document.getElementById('launch-form');
        const queriesJsonInput = document.getElementById('queries-json');
        
        form.addEventListener('submit', (e) => {
            // Collect all queries
            const queries = [];
            const items = queryItems.querySelectorAll('.query-item');
            items.forEach((item) => {
                const qInput = item.querySelector('.query-input');
                const locInput = item.querySelector('.location-input');
                const q = qInput.value.trim();
                const loc = locInput.value.trim();
                if (q && loc) {
                    queries.push({ q, location: loc });
                }
            });

            if (queries.length === 0) {
                e.preventDefault();
                showToast('error', 'Please add at least one query');
                return;
            }

            // Update the hidden input with queries JSON
            queriesJsonInput.value = JSON.stringify(queries);
            
            // Let HTMX handle the form submission normally
        });
    });
</script>

{% endblock %}
